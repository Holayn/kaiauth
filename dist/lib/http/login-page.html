<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: #f5f5f5;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1a1a; }
    h1 { color: #eee; }
    form { background: #262626 !important; color: #eee; }
    input { background: #1a1a1a !important; color: #eee !important; border-color: #444 !important; }
  }
  .page {
    width: 20rem;
    max-width: calc(100vw - 2rem);
  }
  form {
    background: #fff;
    padding: 2rem;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    width: 100%;
    box-sizing: border-box;
  }
  h1 { font-size: 1.1rem; margin: 0 0 1.25rem; text-align: center; }
  h2 { font-size: 1.25rem; margin: 0 0 1.25rem; }
  label { display: block; font-size: 0.875rem; margin-bottom: 0.25rem; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 0.5rem;
    margin-bottom: 1rem;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 1rem;
  }
  button {
    width: 100%;
    padding: 0.6rem;
    border: none;
    border-radius: 4px;
    background: #2563eb;
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .sign-in-btn {
    margin-top: 0.5rem;
  }
  .error {
    color: #dc2626;
    font-size: 0.875rem;
    margin: 0 0 1rem;
  }
  .error:empty { display: none; }
  .status { color: #16a34a; font-size: 0.875rem; margin: 0 0 1rem; }
  .status:empty { display: none; }
  .hint { color: #6b7280; font-size: 0.875rem; margin: 0 0 1rem; }
  .hint:empty { display: none; }
  .link-button {
    display: block;
    width: 100%;
    background: none;
    border: none;
    padding: 0;
    margin: 0.5rem 0 0 0;
    color: #2563eb;
    font-size: 0.875rem;
    text-decoration: underline;
    cursor: pointer;
    text-align: left;
  }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="page">
  <h1>__TITLE__</h1>

  <form id="login-form">
    <div id="login-error" class="error"></div>
    <label for="username">Username</label>
    <input id="username" type="text" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required>
    <button class="sign-in-btn" type="submit">Sign in</button>
  </form>

  <form id="twofa-form" class="hidden">
    <div id="twofa-sent-to" class="hint"></div>
    <div id="twofa-error" class="error"></div>
    <div id="twofa-status" class="status"></div>
    <label for="twoFACode">Verification code</label>
    <input id="twoFACode" type="text" name="twoFACode" inputmode="numeric" autocomplete="one-time-code" required autofocus>
    <button type="submit">Verify</button>
    <button id="resend-email-btn" class="resend-email-btn link-button hidden" type="button">Send code via email instead</button>
  </form>
</div>

<script>window.__KAIAUTH_API_BASE__ = __API_BASE_PATH_JSON__;</script>
<script src="login.js"></script>
</body>
</html>
